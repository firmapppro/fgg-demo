name: Deploy filter proto

on:
  push:
    branches: [main]
    paths:
      - "filter-proto/**"
      - ".github/workflows/deploy-filter-proto.yml"
      - ".github/scripts/ftp_upload.py"
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload filter proto to chypulis.top
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/ftp_upload.py --local filter-proto --remote /filter-proto --skip-suffix .py
