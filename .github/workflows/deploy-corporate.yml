name: Deploy corporate

on:
  push:
    branches: [main]
    paths:
      - "corporate/**"
      - ".github/workflows/deploy-corporate.yml"
      - ".github/scripts/ftp_upload.py"
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload corporate presentation to chypulis.top
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/ftp_upload.py --local corporate --remote /corporate
