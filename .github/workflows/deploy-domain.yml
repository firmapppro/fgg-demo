name: Deploy homepage

on:
  push:
    branches: [main]
    paths:
      - "domain/**"
      - ".github/workflows/deploy-domain.yml"
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload homepage to chypulis.top
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          from ftplib import FTP
          import os
          from pathlib import Path

          ftp = FTP()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.set_pasv(True)
          root = Path("domain")
          for name in ("index.html", "favicon.svg"):
              with (root / name).open("rb") as fh:
                  ftp.storbinary(f"STOR {name}", fh)
              print("uploaded", name, ftp.size(name), "bytes")
          ftp.quit()
          PY
