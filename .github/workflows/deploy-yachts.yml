name: Deploy yachts

on:
  push:
    branches: [main]
    paths:
      - "yachts/**"
      - ".github/workflows/deploy-yachts.yml"
      - ".github/scripts/ftp_upload.py"
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload yachts to chypulis.top
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: >
          python3 .github/scripts/ftp_upload.py
          --local yachts
          --remote /fgg-yachts
          --skip-suffix .py
          --skip-suffix .pdf
          --skip-dir venv
          --skip-dir scratch
          --skip-dir scripts
          --skip-dir PDF
