name: Deploy planes

on:
  push:
    branches: [main]
    paths:
      - "planes/**"
      - ".github/workflows/deploy-planes.yml"
      - ".github/scripts/ftp_upload.py"
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload planes to chypulis.top
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/ftp_upload.py --local planes --remote /fgg-planes --skip-suffix .py
