<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHYPULIS.TOP</title>
    <meta name="description" content="CHYPULIS.TOP">
    <meta name="theme-color" content="#08090c">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chypulis.top/">
    <meta property="og:title" content="CHYPULIS.TOP">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            background: #08090c;
            color: #ece4d6;
            font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
            overflow: hidden;
        }
        .wash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(90% 70% at 72% 58%, #141820 0%, #08090c 62%);
        }
        .spine {
            position: fixed;
            top: 6vh;
            right: 4.5vw;
            z-index: 2;
            margin: 0;
            writing-mode: vertical-rl;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .52em;
            text-transform: lowercase;
            color: #e0c49a;
        }
        .board {
            position: relative;
            z-index: 1;
            height: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
            align-items: center;
            padding: 0 11vw 0 7vw;
            gap: 4vw;
            animation: enter 1.25s cubic-bezier(.16, 1, .3, 1) both;
        }
        h1 {
            margin: 0;
            font-family: "Instrument Serif", "Times New Roman", serif;
            font-weight: 400;
            font-style: italic;
            font-size: clamp(64px, 11.4vw, 168px);
            line-height: .82;
            letter-spacing: -.04em;
        }
        .peak {
            width: min(100%, 560px);
            height: auto;
            justify-self: end;
            margin-top: 8vh;
        }
        .copy {
            position: fixed;
            left: 7vw;
            bottom: 5vh;
            z-index: 2;
            margin: 0;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: .28em;
            text-transform: lowercase;
            color: rgba(224, 196, 154, .48);
        }
        @keyframes enter {
            from { opacity: 0; transform: translate3d(0, 18px, 0); }
            to { opacity: 1; transform: none; }
        }
        @media (max-width: 820px) {
            .board {
                grid-template-columns: 1fr;
                align-content: center;
                padding: 12vh 9vw 14vh;
                gap: 7vh;
            }
            .peak {
                justify-self: end;
                width: min(78%, 340px);
                margin-top: 0;
            }
            .spine { top: 4.5vh; right: 6vw; }
            .copy { left: 9vw; bottom: 4.5vh; letter-spacing: .18em; }
        }
        @media (prefers-reduced-motion: reduce) {
            .board { animation: none; }
        }
    </style>
</head>
<body>
    <div class="wash" aria-hidden="true"></div>
    <p class="spine">.top</p>
    <div class="board">
        <h1>Chypulis</h1>
        <svg class="peak" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M6 24c4-9 7-14 10-16 3 2 6 7 10 16" fill="none" stroke="#e0c49a" stroke-width=".28" stroke-linecap="round"/>
            <path d="M8 20c3.2-4.8 5.4-7.2 8-8.4 2.6 1.2 4.8 3.6 8 8.4" fill="none" stroke="#8fd0d4" stroke-width=".16" stroke-linecap="round" opacity=".75"/>
        </svg>
    </div>
    <p class="copy">chypulis.top © 2026</p>
</body>
</html>
