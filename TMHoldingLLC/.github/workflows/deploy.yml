name: Deploy TM Holding LLC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upload to chypulis.top
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c "
          import os
          from ftplib import FTP
          from pathlib import Path

          host = os.environ.get('FTP_SERVER', 's29.hostia.name')
          user = os.environ.get('FTP_USERNAME', 'dev@chypulis.top')
          pw = os.environ.get('FTP_PASSWORD')

          if not pw:
              raise ValueError('FTP_PASSWORD secret is not defined')

          ftp = FTP()
          ftp.connect(host, 21, timeout=120)
          ftp.login(user, pw)
          ftp.set_pasv(True)
          ftp.encoding = 'utf-8'

          remote_root = '/TMHoldingLLC'

          def ensure_dir(path):
              parts = [p for p in path.split('/') if p]
              cur = ''
              for p in parts:
                  cur += '/' + p
                  try:
                      ftp.mkd(cur)
                  except Exception:
                      pass

          ensure_dir(remote_root)

          local_root = Path('.')
          for path in sorted(local_root.rglob('*')):
              if path.is_file():
                  rel = path.relative_to(local_root)
                  parts = rel.parts
                  if '.git' in parts or '.github' in parts or path.suffix == '.py':
                      continue
                  rel_dir = str(rel.parent).replace('\\\\', '/')
                  target_dir = remote_root if rel_dir == '.' else f'{remote_root}/{rel_dir}'
                  ensure_dir(target_dir)
                  remote_file = f'{target_dir}/{rel.name}'
                  print(f'Uploading {rel} -> {remote_file}')
                  with open(path, 'rb') as f:
                      ftp.storbinary(f'STOR {remote_file}', f)

          ftp.quit()
          print('Deployment to chypulis.top/TMHoldingLLC completed successfully!')
          "
