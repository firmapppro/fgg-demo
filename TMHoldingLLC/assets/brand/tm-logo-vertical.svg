<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4E2" />
      <stop offset="25%" stop-color="#E2C17C" />
      <stop offset="50%" stop-color="#B88E3E" />
      <stop offset="75%" stop-color="#EED7A1" />
      <stop offset="100%" stop-color="#9A742A" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#F7E7C4" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A742A" />
      <stop offset="100%" stop-color="#553F15" />
    </linearGradient>
  </defs>

  <!-- Centered Crest Mark -->
  <g transform="translate(320, 240) scale(0.72) translate(-250, -250)">
    <polygon points="250,22 435,98 478,250 435,402 250,478 65,402 22,250 65,98" 
             fill="none" stroke="url(#goldLinear)" stroke-width="1.8" stroke-opacity="0.45" />
    <polygon points="250,36 422,106 462,250 422,394 250,464 78,394 38,250 78,106" 
             fill="none" stroke="url(#goldLinear)" stroke-width="0.9" stroke-opacity="0.25" stroke-dasharray="8 4" />

    <path d="M 96,152 L 250,116 L 250,146 L 118,174 Z" fill="url(#goldLight)" />
    <path d="M 118,174 L 250,146 L 250,154 L 126,178 Z" fill="url(#goldDark)" />
    <path d="M 404,152 L 250,116 L 250,146 L 382,174 Z" fill="url(#goldLinear)" />
    <path d="M 382,174 L 250,146 L 250,154 L 374,178 Z" fill="url(#goldDark)" />

    <path d="M 234,146 L 250,146 L 250,296 L 234,282 Z" fill="url(#goldLight)" />
    <path d="M 250,146 L 266,146 L 266,282 L 250,296 Z" fill="url(#goldDark)" />
    <polygon points="234,282 250,296 266,282 250,314" fill="url(#goldLinear)" />

    <path d="M 126,380 L 158,188 L 182,188 L 156,380 Z" fill="url(#goldLinear)" />
    <path d="M 158,188 L 170,188 L 146,380 L 136,380 Z" fill="url(#goldLight)" opacity="0.7" />
    <path d="M 374,380 L 342,188 L 318,188 L 344,380 Z" fill="url(#goldDark)" />
    <path d="M 342,188 L 330,188 L 354,380 L 364,380 Z" fill="url(#goldLinear)" opacity="0.8" />

    <path d="M 182,188 L 234,282 L 216,282 L 168,206 Z" fill="url(#goldLight)" />
    <path d="M 168,206 L 216,282 L 206,282 L 162,216 Z" fill="url(#goldDark)" />
    <path d="M 318,188 L 266,282 L 284,282 L 332,206 Z" fill="url(#goldLinear)" />
    <path d="M 332,206 L 284,282 L 294,282 L 338,216 Z" fill="url(#goldDark)" />

    <path d="M 126,380 L 250,432 L 250,412 L 156,370 Z" fill="url(#goldLinear)" />
    <path d="M 156,370 L 250,412 L 250,402 L 176,364 Z" fill="url(#goldLight)" />
    <path d="M 374,380 L 250,432 L 250,412 L 344,370 Z" fill="url(#goldDark)" />
    <path d="M 344,370 L 250,412 L 250,402 L 324,364 Z" fill="url(#goldLinear)" />

    <polygon points="250,412 256,432 250,446 244,432" fill="url(#goldLight)" />
    <polygon points="96,152 82,146 90,162 104,160" fill="url(#goldLight)" />
    <polygon points="404,152 418,146 410,162 396,160" fill="url(#goldLinear)" />
    <polygon points="250,92 257,104 250,116 243,104" fill="url(#goldLight)" />
  </g>

  <!-- Hairline divider with diamond center -->
  <g transform="translate(320, 470)">
    <line x1="-160" y1="0" x2="-20" y2="0" stroke="url(#goldLinear)" stroke-opacity="0.3" stroke-width="1" />
    <rect x="-4" y="-4" width="8" height="8" transform="rotate(45)" fill="url(#goldLight)" />
    <line x1="20" y1="0" x2="160" y2="0" stroke="url(#goldLinear)" stroke-opacity="0.3" stroke-width="1" />
  </g>

  <!-- Centered Typography Hierarchy -->
  <g text-anchor="middle">
    <!-- Primary Latin Name -->
    <text x="320" y="530" fill="url(#goldLinear)" 
          font-family="'Cinzel', 'Trajan Pro', 'Didot', 'Georgia', serif" 
          font-size="44" font-weight="600" letter-spacing="14">TM HOLDING LLC</text>

    <!-- Arabic Official Title -->
    <text x="320" y="575" fill="#E2C17C" fill-opacity="0.9"
          font-family="'Amiri', 'Traditional Arabic', serif" 
          font-size="28" font-weight="700" letter-spacing="6">تي ام هولدنج ذ.م.م</text>

    <!-- Subtitle / Business Domain -->
    <text x="320" y="625" fill="#FFFFFF" fill-opacity="0.85"
          font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" 
          font-size="13" font-weight="500" letter-spacing="8">STRATEGIC MOVABLE ASSET LEASING</text>
    
    <!-- Institutional Compliance / QFC Badge -->
    <text x="320" y="660" fill="#9FB2C8" fill-opacity="0.75"
          font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" 
          font-size="11" font-weight="400" letter-spacing="5">QFC LICENSED ENTITY #05193 • DOHA, QATAR</text>
  </g>
</svg>
